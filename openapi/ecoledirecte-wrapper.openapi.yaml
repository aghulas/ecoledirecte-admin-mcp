definitions:
  Erreur:
    type: object
    properties:
      message: { type: string, description: Message explicite (jamais de jeton ni de mot de passe). }
  ValeurParametre:
    type: object
    properties:
      libelle: { type: string }
      valeur: { type: string, description: "'0'/'1' ou texte ; « <masqué> » pour un secret." }
      encoded: { type: boolean, description: Champ brut renvoyé par EcoleDirecte. }
      intitule: { type: string, description: Intitulé lisible (catalogue). }
      menu: { type: string, description: "Menu de l'admin, ex. « Paramétrages généraux »." }
      rubrique: { type: string, description: "Rubrique de l'admin, ex. « Messagerie »." }
      valeur_decodee: { type: string, description: "Valeur décodée, pour les paramètres stockés en base64." }
      hors_catalogue: { type: boolean, description: Présent (true) seulement si hors_catalogue=true a été demandé pour ce libellé. }
      avertissement: { type: string }
  EntreeCatalogue:
    type: object
    properties:
      libelle: { type: string, description: Libellé exact (indice d'établissement ramené à Etablissement_0). }
      intitule: { type: string }
      menu: { type: string }
      rubrique: { type: string }
      certain:
        type: boolean
        description: >-
          false = libellé construit par le front pour plusieurs profils, dont
          l'existence n'est pas garantie pour chacun.
      secret: { type: boolean, description: Valeur masquée en lecture. }
      modifiable: { type: boolean, description: false = refusé par POST /admin/parametre. }
      base64: { type: boolean, description: Valeur stockée en base64 (décodée / encodée par le serveur). }
      motif: { type: string, description: "Pour un libellé dynamique : motif du catalogue, ex. ModeRestreint/PeriodesModeNormal_{jour}_de." }
